name: GreenX CI/CD Pipeline

on:
  push:
    branches:
      - main   # jab bhi main branch mein koi file change ho aur commit push ho
  workflow_dispatch:   # manually trigger karne ka option bhi rahega

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images (docker-compose.yml)
        run: |
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml push

      - name: Deploy Application (docker-compose.deploy.yml)
        run: |
          docker compose -f docker-compose.deploy.yml down || true
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d
