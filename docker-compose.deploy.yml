version: '3.8'

services:
  frontend:
    image: junaiddocker743/greenx-frontend:latest   # Dock Hub se pull kare
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: junaiddocker743/greenx-backend:latest    # Docker Hub se pull karega
    environment:
      ENV: dev
      DB: mysql
      DB_USER: root
      DB_PASSWORD: passdb0127
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: passdb0127
      MYSQL_DATABASE: all_tables
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

