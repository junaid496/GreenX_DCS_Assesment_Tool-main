version: '3.8'

services:
  frontend:
    image: junaiddocker743/greenx-frontend:latest
    ports:
      - "3000:3000"
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first    # ensures zero downtime rolling update
      restart_policy:
        condition: on-failure
    depends_on:
      - backend
    networks:
      - greenx-net

  backend:
    image: junaiddocker743/greenx-backend:latest
    environment:
      ENV: dev
      DB: mysql
      DB_USER: root
      DB_PASSWORD: passdb0127
      DB_HOST: db
      DB_PORT: 3306
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
    depends_on:
      - db
    networks:
      - greenx-net

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: passdb0127
      MYSQL_DATABASE: all_tables
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - greenx-net

volumes:
  db_data:

networks:
  greenx-net:
    driver: overlay




