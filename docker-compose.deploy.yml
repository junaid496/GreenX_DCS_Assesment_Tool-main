version: '3.8'

services:
  frontend:
    image: junaid496/greenx-frontend:latest   # Docker Hub se pull karega
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: junaid496/greenx-backend:latest    # Docker Hub se pull karega
    env_file:
      - ./backend.env                        # Deploy server pe ye env file hogi
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: passdb0127
      MYSQL_DATABASE: all_tables
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
